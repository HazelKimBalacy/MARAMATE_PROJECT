spring.application.name=MaraMate
server.port=8080

# PostgreSQL (for example, Supabase). Override these with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/maramate}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (FR-003). The secret must be 32+ characters. Use your own value outside development.
maramate.jwt.secret=${JWT_SECRET:dev-only-change-me-dev-only-change-me-0123}
maramate.jwt.expiry-hours=8

# React dev server (Vite)
maramate.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
maramate.frontend-url=${FRONTEND_URL:http://localhost:5173}
maramate.mail.from=${MAIL_FROM:noreply@maramate.local}

# Configure an SMTP provider to deliver password recovery links.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}
